name: PR Validation

on:
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'src/CloudNimble.Breakdance.Docs/**'
      - 'specs/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
   DOTNET_VERSION: '11.0.x'
   SOLUTION_FILE: 'src/CloudNimble.Breakdance.slnx'
   # RWM: On Windows runners the C: OS drive is much slower than D:, where the workspace lives. Keep the SDK and the NuGet caches on D:.
   #      (The runner context isn't available in env, so these are literal paths.)
   DOTNET_INSTALL_DIR: 'D:\dotnet'
   DOTNET_ROOT: 'D:\dotnet'
   NUGET_PACKAGES: 'D:\nuget\packages'
   NUGET_HTTP_CACHE_PATH: 'D:\nuget\http-cache'

jobs:
  validate:
    runs-on: windows-latest

    steps:
    - name: Enable long paths
      shell: pwsh
      run: |
        # Azurite's node_modules tree goes past MAX_PATH.
        git config --system core.longpaths true
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
          -Name 'LongPathsEnabled' -Value 1 -Type DWord

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Install .NET versions
      shell: pwsh
      run: |
         Write-Host "Installing .NET versions..."
         Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
         $installDir = $env:DOTNET_INSTALL_DIR

         Write-Host "Installing .NET 10.0..."
         ./dotnet-install.ps1 -Channel 10.0 -InstallDir $installDir

         Write-Host "Installing .NET 11.0..."
         ./dotnet-install.ps1 -Channel 11.0 -InstallDir $installDir

         echo $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
         dotnet --list-sdks

    - name: Get version variables
      id: version
      shell: pwsh
      run: |
        # PRs into main build the current release line from VERSION_*; PRs into dev (and manual runs) build the next one from DEV_VERSION_*.
        if ("${{ github.base_ref }}" -eq "main") {
          $majorVersion = "${{ vars.VERSION_MAJOR }}"
          $minorVersion = "${{ vars.VERSION_MINOR }}"
        }
        else {
          $majorVersion = "${{ vars.DEV_VERSION_MAJOR }}"
          $minorVersion = "${{ vars.DEV_VERSION_MINOR }}"
        }
        if ([string]::IsNullOrEmpty($majorVersion)) { $majorVersion = "1" }
        if ([string]::IsNullOrEmpty($minorVersion)) { $minorVersion = "0" }

        Write-Host "Version variables: MAJOR=$majorVersion, MINOR=$minorVersion"

        # PR validation: always use CI versioning with timestamp (no version increment)
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss" -AsUTC
        $version = "$majorVersion.$minorVersion.0-CI-$timestamp"

        Write-Host "PR validation version: $version"

        # Output variables
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "MAJOR_VERSION=$majorVersion" >> $env:GITHUB_OUTPUT
        echo "MINOR_VERSION=$minorVersion" >> $env:GITHUB_OUTPUT

        Write-Host "Final version: $version"

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build solution
      # Note: not using --no-restore here. Solution-level restore can silently skip projects
      # with analyzer ProjectReferences. Letting build handle restore for any missed projects
      # only adds a few seconds since packages are already cached.
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release /p:Version=${{ steps.version.outputs.VERSION }} /p:PackageVersion=${{ steps.version.outputs.VERSION }}

    - name: Test
      working-directory: src
      run: dotnet test --configuration Release --no-build

    - name: Pack
      run: dotnet pack ${{ env.SOLUTION_FILE }} --configuration Release --no-build --output ./artifacts /p:PackageVersion=${{ steps.version.outputs.VERSION }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages-pr
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
        retention-days: 7

    - name: Validate packages
      shell: pwsh
      run: |
        Write-Host "Validating NuGet packages..."
        Get-ChildItem ./artifacts -Include *.nupkg, *.snupkg -File -Recurse | ForEach-Object {
          Write-Host "Found package: $($_.Name)"
        }
        Write-Host "PR validation completed successfully"
